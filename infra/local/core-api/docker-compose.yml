services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motor_core}
      POSTGRES_USER: ${POSTGRES_USER:-motorsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motorsure_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - core_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  core_api_postgres_data:
