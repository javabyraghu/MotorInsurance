spring:
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  security:
    jwt:
      issuer-uri: https://identity.test.motorsure.invalid
      audience: motorsure-core-api-test
    cors:
      allowed-origins:
        - https://app.example.test
